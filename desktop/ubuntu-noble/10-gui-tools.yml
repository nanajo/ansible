- hosts: localhost
  tasks:
  - name: install tools for GUI packages from apt
    become: yes
    ansible.builtin.apt:
      update_cache: yes
      pkg:
        - vlc
        - audacity
        - virt-manager

  - name: install tools for GUI packages from snap
    become: yes
    snap:
      name:
        - discord
        - bitwarden
        - thunderbird